<title>Sondaj Takip</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#0f172a;color:#e2e8f0;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
input,button,select,textarea{font-family:inherit;-webkit-appearance:none;appearance:none;font-size:16px}
input:focus,select:focus{outline:2px solid #3b82f6;outline-offset:-1px}
.hdr{border-bottom:1px solid #334155;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;background:#0f172a;position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:8px}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#38bdf8,#818cf8);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.cnt{padding:12px 14px;max-width:1200px;margin:0 auto;padding-bottom:max(20px,env(safe-area-inset-bottom))}
.cd{background:#1e293b;border:1px solid #334155;border-radius:12px;margin-bottom:6px}
.cd.on{border:2px solid #3b82f6;background:#172554}
.cd.ok{border-color:#166534;background:#0f2918}
.cd.wip{border-color:#854d0e;background:#1a1a0f}
.btn{padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:700;color:#fff;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;min-height:40px;touch-action:manipulation}
.inp{padding:10px 12px;background:#0f172a;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:16px;font-family:inherit;outline:none;width:100%;min-height:44px;text-transform:uppercase}
.tabs{display:flex;gap:5px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-bottom:4px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 14px;border-radius:10px;border:2px solid #334155;cursor:pointer;font-size:11px;font-weight:700;background:#1e293b;color:#64748b;font-family:inherit;white-space:nowrap;min-height:40px;touch-action:manipulation}
.tab.on{color:#fff}
.ck{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:12px;user-select:none;padding:6px;min-width:110px;min-height:40px;touch-action:manipulation}
.ckb{width:22px;height:22px;border-radius:5px;border:2px solid;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
table{width:100%;border-collapse:collapse;font-size:12px}
th{padding:8px 6px;text-align:left;font-size:10px;color:#64748b;font-weight:700;border-bottom:2px solid #334155}
td{padding:8px 6px;border-bottom:1px solid #334155;font-size:11px;cursor:pointer;min-height:40px}
.light body,.light{background:#f1f5f9;color:#1e293b}
.light .hdr{background:#f1f5f9;border-color:#e2e8f0}
.light .cd{background:#fff;border-color:#e2e8f0}
.light .cd.on{background:#eff6ff;border-color:#60a5fa}
.light .cd.ok{background:#f0fdf4;border-color:#86efac}
.light .cd.wip{background:#fffbeb;border-color:#fde68a}
.light .inp{background:#f1f5f9;border-color:#e2e8f0;color:#1e293b}
.light .tab{background:#fff;border-color:#e2e8f0}
.light th,.light td{border-color:#e2e8f0}
@media(min-width:768px){.btn{font-size:13px;padding:8px 14px;min-height:36px}.inp{font-size:14px;min-height:38px;padding:8px 10px}.tab{padding:8px 16px;font-size:12px}.ck{font-size:11px;min-height:32px}.cnt{padding:16px 20px}}
@media(max-width:380px){.tab{padding:8px 10px;font-size:10px}.btn{padding:8px 10px;font-size:11px}}

<body>
<div id="app"></div>
<script>
var SEED=[];
var CK=["sondaj","foto","lab","jeofizik","rapor","teslim_ok"];
var CKL={sondaj:"Sondaj",foto:"Fotoğraf",lab:"Lab",jeofizik:"Jeofizik",rapor:"Rapor",teslim_ok:"Teslim"};
var CKC={sondaj:"#38bdf8",foto:"#a78bfa",lab:"#ec4899",jeofizik:"#f97316",rapor:"#22c55e",teslim_ok:"#eab308"};
var CKI={sondaj:"🚒",foto:"📷",lab:"🔬",jeofizik:"📡",rapor:"📋",teslim_ok:"✅"};
var $ = document.getElementById.bind(document);
function M(n){return n?n.toLocaleString("tr-TR")+" TL":"0 TL"}
function TD(){return new Date().toISOString().split("T")[0]}
function fixAdaParsel(){var changed=false;S.jobs.forEach(function(r){
  var sp=splitAP(r.ad);if(sp){r.ad=sp.ad;if(!r.pr)r.pr=sp.pr;changed=true}
  var sp2=splitAP(r.pr);if(sp2){if(!r.ad)r.ad=sp2.ad;r.pr=sp2.pr;changed=true}
});if(changed)SV()}
// === DRIVE VERİ KATMANI ===
// Tek gerçek kaynak Drive'daki veri dosyasıdır. Her değişiklik kayıt kayıt sunucuya yazılır,
// diğer cihazların değişiklikleri 15 sn'de bir alınır. Gönderilemeyen değişiklikler bu cihazda bekletilir.
function LS(k,v){try{if(v!==undefined)localStorage.setItem("st_"+k,JSON.stringify(v));var d=localStorage.getItem("st_"+k);return d?JSON.parse(d):null}catch(e){return null}}
var _sy={busy:false,again:false,timer:null,poll:null,uiPending:false,err:"",state:"ok",last:null,allowMass:false,loaded:false,loadErr:""};
var _snap={},_ver=0,_pend=LS("bekleyen")||{};
function savePend(){LS("bekleyen",_pend)}
function run(fn){var args=[].slice.call(arguments,1);return new Promise(function(ok,no){
  var r=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){no({msg:(e&&e.message)||String(e)})});r[fn].apply(r,args)})}
function flatOf(st){var o={};
  (st.jobs||[]).forEach(function(j){o["j:"+j.id]=JSON.stringify(j)});
  var c=st.checks||{};Object.keys(c).forEach(function(k){if(c[k])o["c:"+k]="1"});
  var t=st.tahsilat||{};Object.keys(t).forEach(function(k){var v=t[k];if(v&&(v.amount||v.note||v.date))o["t:"+k]=JSON.stringify(v)});
  var r=st.rehber||{};Object.keys(r).forEach(function(k){o["r:"+k]=JSON.stringify(r[k])});
  (st.trash||[]).forEach(function(x){o["x:"+x.id]=JSON.stringify(x)});
  return o}
function unflat(o){var st={jobs:[],checks:{},tahsilat:{},rehber:{},trash:[]};
  Object.keys(o).forEach(function(k){var p=k.charAt(0),key=k.slice(2),v=o[k];
    if(p==="j")st.jobs.push(JSON.parse(v));else if(p==="c")st.checks[key]=true;
    else if(p==="t")st.tahsilat[key]=JSON.parse(v);else if(p==="r")st.rehber[key]=JSON.parse(v);
    else if(p==="x")st.trash.push(JSON.parse(v))});
  return st}
function setState(f){var st=unflat(f);S.jobs=st.jobs;S.checks=st.checks;S.tahsilat=st.tahsilat;S.rehber=st.rehber;S.trash=st.trash}
function getSyncData(){return{version:5,jobs:S.jobs,checks:S.checks,tahsilat:S.tahsilat,rehber:S.rehber,trash:S.trash}}

// Değişiklikleri bul ve Drive'a gönder
function SV(){
  if(!_sy.loaded)return;
  var f=flatOf(S),ch=false;
  Object.keys(f).forEach(function(k){if(_snap[k]!==f[k]){_pend[k]=f[k];ch=true}});
  Object.keys(_snap).forEach(function(k){if(!(k in f)){_pend[k]=null;ch=true}});
  _snap=f;
  if(ch){savePend();setBadge("busy");clearTimeout(_sy.timer);_sy.timer=setTimeout(syncNow,500)}
}
// Diğer cihazdan gelenleri uygula (bu cihazda henüz gönderilmemiş kayıtlara dokunma)
function applyRemote(ch){
  var ks=Object.keys(ch||{});if(!ks.length)return;
  var f=flatOf(S),n=0;
  ks.forEach(function(k){if(k in _pend)return;var v=ch[k];
    if(v===null){if(k in f){delete f[k];n++}delete _snap[k]}
    else{if(f[k]!==v){f[k]=v;n++}_snap[k]=v}});
  if(n){setState(f);uiRefresh()}
}
function isTyping(){var a=document.activeElement;return!!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=="searchInp"&&a.id!=="pinInp")}
function uiRefresh(){if(S.locked)return;if(isTyping())_sy.uiPending=true;else R()}
function uiRefreshIfAyar(){if(S.view==="ayar"&&!isTyping()&&!S.locked)R()}

function syncNow(){
  if(!_sy.loaded)return;
  if(_sy.busy){_sy.again=true;return}
  _sy.busy=true;
  var keys=Object.keys(_pend),p;
  if(keys.length){
    var ch={};keys.forEach(function(k){ch[k]=_pend[k]});setBadge("busy");
    var am=!!_sy.allowMass;
    p=run("kaydet",ch,_ver,am).then(function(r){
      if(!r.ok&&r.err==="toplu")throw{mass:r.sayi};
      keys.forEach(function(k){if(_pend[k]===ch[k])delete _pend[k]});savePend();
      if(am&&!Object.keys(_pend).length)_sy.allowMass=false;applyRemote(r.ch);_ver=r.ver})
  }else{
    p=run("degisiklikler",_ver).then(function(r){applyRemote(r.ch);_ver=r.ver})
  }
  p.then(function(){
    _sy.busy=false;_sy.err="";_sy.last=new Date();
    if(_sy.again||Object.keys(_pend).length){_sy.again=false;setTimeout(syncNow,300)}else setBadge("ok");
  }).catch(function(e){
    _sy.busy=false;_sy.again=false;
    if(e&&e.mass){_sy.err=e.mass+" kaydın silinmesi güvenlik için durduruldu";setBadge("err");uiRefreshIfAyar();return}
    _sy.err=(e&&e.msg)||"Bağlantı yok";setBadge(navigator.onLine?"err":"off");
    clearTimeout(_sy.timer);_sy.timer=setTimeout(syncNow,8000);
  })
}
// Açılışta Drive'dan bütün veriyi yükle
function loadAll(){
  _sy.loadErr="";R();
  run("yukle").then(function(r){
    _snap=r.kv;_ver=r.ver;setState(r.kv);_sy.loaded=true;S.sifreVar=r.sifreVar;
    // bu cihazda gönderilemeden kalmış değişiklik varsa uygula ve gönder
    var bek=Object.keys(_pend);
    if(bek.length){var f=flatOf(S);bek.forEach(function(k){if(_pend[k]===null)delete f[k];else f[k]=_pend[k]});setState(f)}
    fixAdaParsel();
    R();
    if(bek.length)syncNow();
    if(_sy.poll)clearInterval(_sy.poll);
    _sy.poll=setInterval(function(){if(!document.hidden)syncNow()},15000);
  }).catch(function(e){_sy.loadErr=(e&&e.msg)||"Drive'a ulaşılamadı";R()})
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)syncNow()});
window.addEventListener("online",function(){syncNow()});
setInterval(function(){if(_sy.uiPending&&!isTyping()){_sy.uiPending=false;R()}},1500);

function paintBadge(el){
  if(!el)return;var dot=el.firstChild,txt=el.lastChild;if(!dot||!txt)return;
  var st=_sy.state,col,t,anim="none",bek=Object.keys(_pend).length;
  if(st==="busy"){col="#f97316";t="Kaydediliyor…"}
  else if(st==="err"){col="#ef4444";t=bek?"Kaydedilemedi ("+bek+") · tekrar denenecek":"Bağlantı hatası"}
  else if(st==="off"){col="#94a3b8";t=bek?"Çevrimdışı · "+bek+" bekliyor":"Çevrimdışı"}
  else{col="#22c55e";anim="pulse 2s infinite";t="Drive ✓ "+(_sy.last?_sy.last.toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}):"")}
  dot.style.background=col;dot.style.animation=anim;txt.textContent=t;txt.style.color=col}
function setBadge(st){_sy.state=st;paintBadge(document.getElementById("syncStatus"))}

// Yedekler
function listSnaps(cb){run("yedekListe").then(function(l){cb(l||[])}).catch(function(){cb(null)})}
function replaceAll(d,msg){
  _sy.allowMass=true;S.jobs=d.jobs||[];S.checks=d.checks||{};S.tahsilat=d.tahsilat||{};S.rehber=d.rehber||{};S.trash=d.trash||[];
  SV();R();alert(msg+": "+S.jobs.length+" kayıt")}
function restoreSnap(name){
  if(!confirm(name.replace(".json","")+" yedeği yüklenecek.\nŞu anki veriler bu yedekle değiştirilecek (öncesinde otomatik yedek alınır).\n\nDevam?"))return;
  run("yedekAlSimdi").then(function(){return run("yedekGetir",name)}).then(function(d){replaceAll(d,"Yedek yüklendi")}).catch(function(e){alert("Yedek okunamadı: "+((e&&e.msg)||""))})}
function doCloudBackup(){run("yedekAlSimdi").then(function(r){if(confirm("Yedek Drive'a kaydedildi:\n"+r.ad+"\n\nDrive'da açılsın mı?"))window.open(r.url,"_blank")}).catch(function(e){alert("Yedek alınamadı: "+((e&&e.msg)||""))})}
function doBackup(){doCloudBackup()}
function smartMerge(d){
  if(!confirm("Bu dosyadaki "+(d.jobs||[]).length+" kayıt, mevcut "+S.jobs.length+" kaydın yerine yüklenecek (öncesinde otomatik yedek alınır).\nDevam?"))return"İptal edildi";
  run("yedekAlSimdi").then(function(){replaceAll(d,"Yüklendi")});return"Yükleniyor…"}
function changePw(eski,yeni){return run("sifreDegistir",eski,yeni).then(function(r){alert(r.ok?"Şifre değiştirildi. Bütün cihazlarda yeni şifre geçerli.":r.err)})}
function dlFile(blob,name){try{var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}catch(e){}}

var S={
  jobs:[],checks:{},tahsilat:{},trash:[],rehber:{},
  view:"is",search:"",openId:null,showAdd:false,showBk:false,locked:true,theme:"dark",
  selIv:null,rehEdit:null,confirmDel:null,showSnaps:false,sifreVar:true
};
if(new Date().getHours()>=7&&new Date().getHours()<19)S.theme="light";
function getCk(id,f){return!!S.checks[id+"_"+f]}
function getTh(id){return S.tahsilat[""+id]||{amount:0,date:"",note:""}}
function getBk(r){return r.tu-(getTh(r.id).amount||0)}
function gp(id){if(getCk(id,"teslim_ok"))return 6;var d=0;CK.forEach(function(c){if(getCk(id,c))d++});return d}
function pct(id){return getCk(id,"teslim_ok")?100:Math.round(gp(id)/6*100)}
function allJ(){return(S.jobs||SEED).slice().sort(function(a,b){return a.tr>b.tr?-1:a.tr<b.tr?1:b.id-a.id})}
function splitAP(v){var m=String(v||"").match(/^(\d+)\s*[\/\-]\s*(\d+)$/);return m?{ad:m[1],pr:m[2]}:null}
function actJ(){return allJ().filter(function(r){return r.ts!=="TESLİM"&&r.ts!=="İPTAL"})}
function fltJ(){
  var v=S.view,l=v==="is"?actJ():v==="eksik"?actJ().filter(function(r){return gp(r.id)<6}):allJ();
  if(S.search){var q=S.search.toLowerCase().trim(),dm=q.match(/^(\d+)\s*[-\/]\s*(\d+)$/);
    if(dm)l=l.filter(function(r){return r.ad&&r.ad.indexOf(dm[1])>=0&&r.pr&&r.pr.indexOf(dm[2])>=0});
    else l=l.filter(function(r){return(r.nm||"").toLowerCase().indexOf(q)>=0||(r.iv||"").toLowerCase().indexOf(q)>=0||(r.il||"").toLowerCase().indexOf(q)>=0||(r.mh||"").toLowerCase().indexOf(q)>=0||(r.ad||"").indexOf(q)>=0||(r.pr||"").indexOf(q)>=0})}
  return l}
function cariJ(){var m={};allJ().forEach(function(r){var k=r.iv||"?";if(!m[k])m[k]={iv:k,tu:0,th:0,bk:0,n:0,recs:[]};m[k].tu+=r.tu;m[k].th+=(getTh(r.id).amount||0);m[k].bk+=getBk(r);m[k].n++;m[k].recs.push(r)});return Object.values(m).sort(function(a,b){return b.bk-a.bk})}

// === DOM HELPERS ===
function E(tag,cls,html){var el=document.createElement(tag);if(cls)el.className=cls;if(html!==undefined)el.innerHTML=html;return el}
function STY(el,s){Object.assign(el.style,s);return el}
function ON(el,ev,fn){el.addEventListener(ev,fn);return el}
function ADD(parent){for(var i=1;i<arguments.length;i++)if(arguments[i])parent.appendChild(arguments[i]);return parent}

// === RENDER ===
function R(){
  // Save focused element
  var ae=document.activeElement;
  var fid=ae?ae.id:"";
  var fval=ae?ae.value:"";
  var fsel=ae?ae.selectionStart:-1;
  // If editing tahsilat, save first
  if(fid&&fid.indexOf("th_")===0){var rid=fid.split("_").pop();saveTh(rid)}
  
  var dk=S.theme==="dark";
  document.documentElement.className=dk?"":"light";
  var tc=document.querySelector('meta[name="theme-color"]');
  if(tc)tc.content=dk?"#0f172a":"#f1f5f9";
  var app=$("app");app.innerHTML="";
  // === YÜKLEME ===
  if(!_sy.loaded){
    var lw=STY(E("div"),{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:"20px"});
    var lbx=STY(E("div","cd"),{padding:"24px",maxWidth:"340px",textAlign:"center",borderRadius:"16px"});
    lbx.innerHTML=_sy.loadErr?'<div style="font-size:28px">⚠️</div><div style="font-size:13px;font-weight:700;margin:8px 0">Drive\'a ulaşılamadı</div><div style="font-size:11px;color:#94a3b8;margin-bottom:12px">'+_sy.loadErr+'</div>'
      :'<div style="font-size:28px">☁️</div><div style="font-size:13px;font-weight:700;margin-top:8px">Veriler Drive\'dan yükleniyor…</div>';
    if(_sy.loadErr){var rt=E("button","btn","Tekrar dene");STY(rt,{background:"#3b82f6",width:"100%"});ON(rt,"click",loadAll);ADD(lbx,rt)}
    ADD(lw,lbx);ADD(app,lw);return}

  // === LOGIN ===
  if(S.locked){
    var w=STY(E("div"),{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"});
    var bx=STY(E("div","cd"),{padding:"24px",width:"90%",maxWidth:"320px",textAlign:"center",borderRadius:"16px"});
    bx.innerHTML='<div style="width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#38bdf8,#818cf8);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;margin:0 auto 14px">₺</div><div style="font-size:15px;font-weight:700;margin-bottom:4px">CARİ HESAP & İŞ TAKİP</div><div style="font-size:10px;color:#64748b;margin-bottom:16px">'+(S.sifreVar?'Şifrenizi girin':'İlk giriş: yeni bir şifre belirleyin')+'</div>';
    var pi=E("input","inp");pi.type="password";pi.placeholder="Şifre";STY(pi,{textAlign:"center",letterSpacing:"6px",fontSize:"18px",marginBottom:"12px",minHeight:"50px"});
    pi.id="pinInp";
    ON(pi,"keydown",function(e){if(e.key==="Enter")doLogin()});
    var lb=E("button","btn","\u{1F513} Giriş");STY(lb,{width:"100%",padding:"14px",fontSize:"16px",background:"#3b82f6",borderRadius:"10px",marginBottom:"12px"});
    ON(lb,"click",doLogin);
    var fb=STY(E("button","","\u015Eifremi Unuttum"),{background:"none",border:"none",color:"#64748b",fontSize:"12px",cursor:"pointer",textDecoration:"underline",padding:"10px",minHeight:"44px"});
    ON(fb,"click",function(){var m=prompt("Master şifre girin:");if(!m)return;run("sifreKontrol",m).then(function(r){if(r.ok&&r.sifirlandi){S.sifreVar=false;alert("Şifre sıfırlandı. Yeni şifrenizi belirleyin.");R()}else alert("Yanlış master şifre")})});
    ADD(bx,pi,lb,fb);ADD(w,bx);ADD(app,w);
    setTimeout(function(){var inp=$("pinInp");if(inp)inp.focus()},100);
    return}

  // === HEADER ===
  var hdr=E("div","hdr");
  var hl=STY(E("div"),{display:"flex",alignItems:"center",gap:"8px"});
  hl.innerHTML='<div class="logo">₺</div><div style="font-size:13px;font-weight:700">CARİ HESAP & İŞ TAKİP</div>';

      var nb=E("button","btn","Hayır");STY(nb,{background:"#64748b"});ON(nb,"click",function(e){e.stopPropagation();S.confirmDel=null;R()});
      ADD(cd2,yb,nb);ADD(acts,cd2);
    }else{
      var db=STY(E("button","","🗑"),{width:"40px",height:"40px",borderRadius:"8px",border:"1px solid #334155",cursor:"pointer",fontSize:"16px",background:"transparent",color:"#64748b",display:"flex",alignItems:"center",justifyContent:"center"});
      ON(db,"click",function(e){e.stopPropagation();S.confirmDel=r.id;R()});ADD(acts,db)}
    ADD(det,acts);ADD(c,det)}
  return c}

function saveTh(id){

function delJob(id){
  var job=allJ().find(function(j){return j.id===id});
  if(job){S.trash.push(Object.assign({},job,{deletedAt:TD()}))}
  S.jobs=allJ().filter(function(j){return j.id!==id});

}

function loadXLSX(cb){
  if(window.XLSX)return cb();
  var s=document.createElement("script");
  s.src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js";
  s.onload=cb;
  s.onerror=function(){alert("Excel kütüphanesi yüklenemedi.\nİnternet bağlantınızı kontrol edin.\n\nAlternatif: JSON yedek dosyası kullanın.")};
  document.head.appendChild(s);
}
function doRestore(){
  var input=document.createElement("input");input.type="file";input.accept=".xlsx,.xls,.json";
  input.onchange=function(e){var file=e.target.files[0];if(!file)return;
    var ext=file.name.split(".").pop().toLowerCase();
    var reader=new FileReader();
    if(ext==="json"){
      reader.onload=function(ev){
        try{var d=JSON.parse(ev.target.result);
          if(d.sync||d.version>=3){
            var msg=smartMerge(d);alert(msg)
          }else{
            var msg2=smartMerge(d);alert(msg2);
            
          }}
        catch(err){alert("JSON okunamadı")}};
      reader.readAsText(file);
    }else{
      loadXLSX(function(){
      reader.onload=function(ev){
        try{
          var wb=XLSX.read(ev.target.result,{type:"array",cellDates:true});
          var ws=wb.Sheets[wb.SheetNames[0]];
          var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
          if(rows.length<2){alert("Veri bulunamadı");return}
          var h=rows[0];var ci={};
          for(var i=0;i<h.length;i++){
            var hv=String(h[i]||"").toUpperCase().trim();
            if(hv==="İŞVEREN"||hv==="ISVEREN")ci.iv=i;
            if(hv==="TARİH"||hv==="TARIH")ci.tr=i;
            if(hv==="İSİM"||hv==="ISIM"||hv==="MÜLKİYET"||hv==="MULKIYET")ci.nm=i;
            if(hv==="İLÇE"||hv==="ILCE")ci.il=i;
            if(hv==="MAHALLE")ci.mh=i;
            if(hv==="ADA")ci.ad=i;
            if(hv==="PARSEL")ci.pr=i;
            if(hv==="SONDAJ")ci.sondaj=i;
            if(hv==="LAB")ci.lab=i;
            if(hv.indexOf("AÇIKLAMA")>=0||hv.indexOf("ACIKLAMA")>=0)ci.note=i;
            if(hv==="TESLİM"||hv==="TESLIM")ci.teslim=i;
            if(hv==="TUTAR")ci.tu=i;
            if(hv==="TAHSİLAT"||hv==="TAHSILAT")ci.th=i;
            if(hv==="TARİH2"||hv==="TARIH2")ci.tr2=i;
          }
          var jobs=[],checks={},tahsilat={};
          for(var r=1;r<rows.length;r++){
            var row=rows[r];
            var tr=row[ci.tr!==undefined?ci.tr:1];
            if(!tr)continue;
            if(tr instanceof Date){var dd=tr;tr=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0")}
            else{tr=String(tr).split(" ")[0]}
            var rid=r-1;
            var clean=function(v){var s=String(v||"").trim();return s==="undefined"||s==="null"?"":s};
            var iv=clean(row[ci.iv!==undefined?ci.iv:0]);
            var nm=clean(row[ci.nm!==undefined?ci.nm:2]);
            var il=clean(row[ci.il!==undefined?ci.il:3]);
            var mh=clean(row[ci.mh!==undefined?ci.mh:4]);
            var ad=clean(row[ci.ad!==undefined?ci.ad:5]);
            var pr=clean(row[ci.pr!==undefined?ci.pr:6]);
            var spAP=splitAP(ad);if(spAP){ad=spAP.ad;if(!pr)pr=spAP.pr}
            var spAP2=splitAP(pr);if(spAP2){if(!ad)ad=spAP2.ad;pr=spAP2.pr}
            var sondaj=clean(row[ci.sondaj!==undefined?ci.sondaj:7]);
            var lab=clean(row[ci.lab!==undefined?ci.lab:8]);
            var note=clean(row[ci.note!==undefined?ci.note:9]);
            var teslim=clean(row[ci.teslim!==undefined?ci.teslim:10]);
            var tu=parseFloat(row[ci.tu!==undefined?ci.tu:11])||0;
            var thv=parseFloat(row[ci.th!==undefined?ci.th:12])||0;
            var tr2=ci.tr2!==undefined?clean(row[ci.tr2]):"";
            if(tr2 instanceof Date){var dd2=tr2;tr2=dd2.getFullYear()+"-"+String(dd2.getMonth()+1).padStart(2,"0")+"-"+String(dd2.getDate()).padStart(2,"0")}

            jobs.push({id:rid,iv:iv,tr:tr,nm:nm,il:il,mh:mh,ad:ad,pr:pr,tu:Math.round(tu),ts:teslim,sn:""});
            if(sondaj&&(sondaj.toUpperCase().indexOf("YAPILDI")>=0||sondaj.indexOf("202")>=0))checks[rid+"_sondaj"]=true;
            if(lab&&(lab.toUpperCase().indexOf("YAPILDI")>=0||lab.indexOf("202")>=0||lab==="X"))checks[rid+"_lab"]=true;
            if(teslim&&teslim.toUpperCase().indexOf("TESLİM")>=0)checks[rid+"_teslim_ok"]=true;
            if(thv>0)tahsilat[""+rid]={amount:Math.round(thv),date:tr2?String(tr2).split(" ")[0]:"",note:note};
          }
          if(!confirm("Excel'deki "+jobs.length+" kayıt, mevcut "+S.jobs.length+" kaydın yerine yüklenecek (öncesinde Drive'a otomatik yedek alınır).\nDevam?"))return;
          run("yedekAlSimdi").then(function(){replaceAll({jobs:jobs,checks:checks,tahsilat:tahsilat,rehber:S.rehber,trash:S.trash},"Excel yüklendi")});
        }catch(err){alert("Excel okunamadı: "+err.message)}};
      reader.readAsArrayBuffer(file);
      });
    }};input.click();
}

  allJ().forEach(function(r){var t=getTh(r.id);var ad=r.ad,pr=r.pr;var sp=splitAP(ad);if(sp){ad=sp.ad;if(!pr)pr=sp.pr}var sp2=splitAP(pr);if(sp2){if(!ad)ad=sp2.ad;pr=sp2.pr}
    csv+=[r.tr,r.iv,r.nm,r.il,r.mh,ad,pr,r.bd||"",r.zm||"",r.kt||"",getCk(r.id,"sondaj")?"YAPILDI":"",getCk(r.id,"foto")?"YAPILDI":"",getCk(r.id,"lab")?"YAPILDI":"",getCk(r.id,"jeofizik")?"YAPILDI":"",getCk(r.id,"rapor")?"YAPILDI":"",getCk(r.id,"teslim_ok")?"YAPILDI":"",r.tu,t.amount||0,getBk(r),pct(r.id)+"%"].join(";")+"\n"});
  var ad="cari_"+TD()+".csv";
  run("csvKaydet",csv,ad).then(function(r){if(confirm("Excel çıktısı Drive'a kaydedildi:\nSondaj Takip › Çıktılar › "+r.ad+"\n\nAçılsın mı?"))window.open(r.url,"_blank")}).catch(function(e){alert("Çıktı kaydedilemedi: "+((e&&e.msg)||""))});
}

// === TKGM PARSEL SORGUSU (Drive betiği üzerinden; il her zaman Afyonkarahisar) ===
var _tkgmCache={}; // {jobId: {feature, ilce, mahalle}}
function tkgmAutoLoad(r){
  if(_tkgmCache[r.id]){tkgmShowResult(r,_tkgmCache[r.id]);return}
  tkgmKML(r,function(){},true);
}
function tkgmShowResult(r,res){
  var st=$("tkSt_"+r.id),dt=$("tkDt_"+r.id),kb=$("kml_"+r.id),rb=$("tkRe_"+r.id);
  if(!st)return;
  var p=(res.feature&&res.feature.properties)||{};
  st.innerHTML="✅ Parsel bulundu — Afyonkarahisar / "+(res.ilce||"")+" / "+(res.mahalle||"");st.style.color="#22c55e";st.style.background="#22c55e15";
  if(dt){
    var info="";
    if(p.alan)info+="<b>Alan:</b> "+p.alan+" m² &nbsp;";
    if(p.nitelik)info+="<b>Nitelik:</b> "+p.nitelik+" &nbsp;";
    if(p.mevkii)info+="<b>Mevkii:</b> "+p.mevkii+" &nbsp;";
    if(p.pafta)info+="<b>Pafta:</b> "+p.pafta+" &nbsp;";
    if(!info)info="Parsel sınırı alındı — KML olarak indirebilirsiniz.";
    dt.innerHTML=info;dt.style.display="block";
  }
  if(kb)kb.style.display="inline-flex";
  if(rb)rb.style.display="inline-flex";
}
function tkgmShowError(r,msg){
  var st=$("tkSt_"+r.id),rb=$("tkRe_"+r.id);
  if(st){st.innerHTML="❌ "+msg;st.style.color="#ef4444";st.style.background="#ef444415"}
  if(rb)rb.style.display="inline-flex";
}
function tkgmKML(r,doneCb,autoMode){
  var ilce=(r.il||"").trim(),mah=(r.mh||"").trim(),ada=(r.ad||"").trim(),parsel=(r.pr||"").trim();
  if(!ilce||!mah||!ada||!parsel){tkgmShowError(r,"İLÇE, MAHALLE, ADA ve PARSEL bilgileri gerekli");doneCb(false);return}
  run("tkgm",{ilce:ilce,mahalle:mah,ada:ada,parsel:parsel}).then(function(res){
    if(!res||!res.ok){
      var m=(res&&res.err)||"Sorgu başarısız";
      if(res&&res.secenekler&&res.secenekler.length)m+=" — olası adlar: "+res.secenekler.slice(0,8).join(", ")+(res.secenekler.length>8?"…":"");
      tkgmShowError(r,m);doneCb(false);return}
    _tkgmCache[r.id]=res;
    if(autoMode){tkgmShowResult(r,res);doneCb(true)}else{generateKML(res,ada,parsel,doneCb)}
  }).catch(function(e){tkgmShowError(r,(e&&e.msg)||"TKGM'ye ulaşılamadı");doneCb(false)});
}
function generateKML(res,ada,parsel,doneCb){
  var f=res.feature||res,geom=f.geometry,p=f.properties||{};
  if(!geom){alert("Parsel sınırı bulunamadı");doneCb(false);return}
  var polys=geom.type==="MultiPolygon"?geom.coordinates:[geom.coordinates];
  var esc=function(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")};
  var pm=polys.map(function(poly){return'<Polygon><outerBoundaryIs><LinearRing><coordinates>\n'+formatCoords(poly[0])+'\n</coordinates></LinearRing></outerBoundaryIs></Polygon>'}).join("\n");
  var kml='<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>\n'
    +'<name>'+esc((res.mahalle||"")+" "+ada+"/"+parsel)+'</name>\n'
    +'<Style id="parsel"><LineStyle><color>ff0000ff</color><width>3</width></LineStyle><PolyStyle><color>400000ff</color></PolyStyle></Style>\n'
    +'<Placemark>\n<name>Ada '+esc(ada)+' / Parsel '+esc(parsel)+'</name>\n'
    +'<description>'+esc("Afyonkarahisar / "+(res.ilce||"")+" / "+(res.mahalle||"")+(p.alan?"\nAlan: "+p.alan+" m²":"")+(p.nitelik?"\nNitelik: "+p.nitelik:"")+(p.mevkii?"\nMevkii: "+p.mevkii:""))+'</description>\n'
    +'<styleUrl>#parsel</styleUrl>\n'+(polys.length>1?'<MultiGeometry>'+pm+'</MultiGeometry>':pm)+'\n</Placemark>\n</Document>\n</kml>';
  var ad="parsel_"+(res.mahalle||"")+"_"+ada+"_"+parsel+".kml";
  dlFile(new Blob([kml],{type:"application/vnd.google-earth.kml+xml"}),ad);
  run("kmlKaydet",kml,ad).then(function(r2){if(confirm("KML dosyası Drive'a kaydedildi:\nSondaj Takip › KML › "+r2.ad+"\n\nDrive'da açılsın mı?"))window.open(r2.url,"_blank")}).catch(function(){});
  doneCb(true);
}
function formatCoords(c){
  if(!c)return"";
  if(typeof c[0]==="number")return c[0]+","+c[1]+",0";
  if(Array.isArray(c[0])&&typeof c[0][0]==="number")return c.map(function(q){return q[0]+","+q[1]+",0"}).join("\n");
  return formatCoords(c[0]);
}
