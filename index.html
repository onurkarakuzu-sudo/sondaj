<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sondaj Takip — yeni adres</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--ac:#3b82f6}
@media (prefers-color-scheme: light){:root{--bg:#f1f5f9;--card:#fff;--tx:#1e293b;--mut:#64748b}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--tx);font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:16px;box-sizing:border-box}
.cd{background:var(--card);border-radius:16px;padding:24px;max-width:380px;width:100%;text-align:center}
a.btn,button{display:block;width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:0;background:var(--ac);color:#fff;font-size:16px;font-weight:700;text-decoration:none;margin-top:12px;cursor:pointer}
button{background:#475569;font-size:13px}
p{color:var(--mut);font-size:13px;line-height:1.6}
</style>
</head>
<body>
<div class="cd">
  <div style="font-size:34px">☁️</div>
  <h3>Sondaj Takip taşındı</h3>
  <p>Uygulama artık Google Drive'da çalışıyor. Google hesabınızla girişli olmanız yeterli; veriler Drive › Sondaj Takip klasöründe tutulur.</p>
  <a class="btn" id="git" href="https://script.google.com/macros/s/AKfycbyLIFxxQoJdsy29ylGgLIEOJlA1BwrwFRrNBuQACNvHT-_K_IskhP-Jt653tgqzKnEQPQ/exec">Uygulamayı aç</a>
  <p style="margin-top:14px">Telefonda ana ekrana eklemek için yeni adresi açtıktan sonra “Ana Ekrana Ekle”yi kullanın.</p>
  <button id="eski" style="display:none">Bu cihazdaki eski verileri dosya olarak indir</button>
</div>
<script>
(function(){
  try{
    var jb=localStorage.getItem("z_jb");
    if(jb){var b=document.getElementById("eski");b.style.display="block";
      b.onclick=function(){var d={jobs:JSON.parse(jb||"[]"),checks:JSON.parse(localStorage.getItem("z_ck")||"{}"),tahsilat:JSON.parse(localStorage.getItem("z_th")||"{}"),rehber:JSON.parse(localStorage.getItem("z_rh")||"{}"),trash:JSON.parse(localStorage.getItem("z_tr")||"[]")};
        var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:"application/json"}));a.download="sondaj_eski_cihaz_verisi.json";a.click()}}
  }catch(e){}
  if(!/eski=1/.test(location.search))setTimeout(function(){location.href=document.getElementById("git").href},2500);
})();
</script>
</body>
</html>
