<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#0f172a;color:#e2e8f0;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

input:focus,select:focus{outline:2px solid #3b82f6;outline-offset:-1px}
.hdr{border-bottom:1px solid #334155;padding:12px 14px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;background:#0f172a;position:sticky;top:0;z-index:50;flex-wrap:wrap;gap:8px}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#38bdf8,#818cf8);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}

.btn{padding:10px 14px;border-radius:8px;border:none;cursor:pointer;font-size:12px;font-weight:700;color:#fff;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;min-height:40px;touch-action:manipulation}

<body>
<div id="app"></div>
<script>
var SEED=[];
var CK=["sondaj","foto","lab","jeofizik","rapor","teslim_ok"];
var CKL={sondaj:"Sondaj",foto:"Fotoğraf",lab:"Lab",jeofizik:"Jeofizik",rapor:"Rapor",teslim_ok:"Teslim"};
var CKC={sondaj:"#38bdf8",foto:"#a78bfa",lab:"#ec4899",jeofizik:"#f97316",rapor:"#22c55e",teslim_ok:"#eab308"};
var CKI={sondaj:"🚒",foto:"📷",lab:"🔬",jeofizik:"📡",rapor:"📋",teslim_ok:"✅"};
var $ = document.getElementById.bind(document);
function M(n){return n?n.toLocaleString("tr-TR")+" TL":"0 TL"}
function TD(){return new Date().toISOString().split("T")[0]}
function LS(k,v){if(v!==undefined){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}try{var d=localStorage.getItem(k);return d?JSON.parse(d):null}catch(e){return null}}
function SV(){origSV();if(stampChanges())schedSync()}
function getSyncData(){return{version:4,sync:new Date().toISOString(),jobs:S.jobs,checks:S.checks,tahsilat:S.tahsilat,rehber:S.rehber,trash:S.trash,mt:S.mt}}
function fixAdaParsel(){var changed=false;S.jobs.forEach(function(r){
  var sp=splitAP(r.ad);if(sp){r.ad=sp.ad;if(!r.pr)r.pr=sp.pr;changed=true}
  var sp2=splitAP(r.pr);if(sp2){if(!r.ad)r.ad=sp2.ad;r.pr=sp2.pr;changed=true}
});if(changed)LS("z_jb",S.jobs)}
function doCloudBackup(){
  try{
    var data=getSyncData();var json=JSON.stringify(data);
    var blob=new Blob([json],{type:"application/json"});
    var file=new File([blob],"sondaj_sync.json",{type:"application/json"});
    if(navigator.share){
      navigator.share({files:[file],title:"Sondaj Yedek"}).then(function(){
        LS("z_lastBackup",TD());alert("Yedek paylaşıldı!")
      }).catch(function(err){
        if(err.name!=="AbortError"){dlFile(blob,"sondaj_sync.json")}
      })
    }else{dlFile(blob,"sondaj_sync.json")}
  }catch(e){dlFile(new Blob([JSON.stringify(getSyncData())],{type:"application/json"}),"sondaj_sync.json")}
}
function dlFile(blob,name){
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();
  LS("z_lastBackup",TD());
}

// === ANLIK SENKRONİZASYON (Google Drive, kayıt bazlı birleştirme) ===
var DRIVE_URL="https://script.google.com/macros/s/AKfycbz1QkDYgmHV-P1viWthX4SlW-2sNKgfbLKvZ-a68SoMuo49CdBYXT9OushUinHpGwe-GQ/exec";
var _sy={busy:false,again:false,timer:null,poll:null,uiPending:false,err:"",state:"ok"};
var _snap=null,_key=null,_out=LS("z_out")||{};
function ghActive(){return/^https:\/\//.test(DRIVE_URL)}
function driveOn(){return ghActive()&&!!_key}
function saveOut(){LS("z_out",_out)}
function deviceName(){return/iPhone|iPad|Android/i.test(navigator.userAgent)?"telefon":"bilgisayar"}
function mkKey(pw){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(pw+"|sondaj-takip")).then(function(b){return Array.from(new Uint8Array(b)).map(function(x){return("0"+x.toString(16)).slice(-2)}).join("")})}
function api(op,body,tries){
  body=body||{};body.op=op;body.key=_key;tries=tries||0;
  return fetch(DRIVE_URL,{method:"POST",redirect:"follow",body:JSON.stringify(body),headers:{"Content-Type":"text/plain;charset=utf-8"}})
    .then(function(r){if(!r.ok)throw{msg:"Sunucu hatası "+r.status,retry:1};return r.text()})
    .then(function(t){try{return JSON.parse(t)}catch(e){throw{msg:"Sunucu yanıtı okunamadı",retry:1}}})
    .catch(function(e){
      // Google'ın yanıt sunucusu arada 404 verebiliyor; istekler tekrarlanabilir olduğu için yeniden dene
      if(tries<4&&(!e||e.retry||e instanceof TypeError))return new Promise(function(ok){setTimeout(ok,800*(tries+1))}).then(function(){return api(op,body,tries+1)});
      throw e})}
function chk(r){if(r&&r.ok)return r;if(r&&r.err==="auth")throw{auth:1};if(r&&r.err==="locked")throw{locked:1};throw{msg:(r&&r.err)||"Sunucu yanıt vermedi"}}

// Veriyi kayıt kayıt "anahtar → değer" haritasına çevir
function flatOf(st){var o={};
  (st.jobs||[]).forEach(function(j){o["j:"+j.id]=JSON.stringify(j)});
  var c=st.checks||{};Object.keys(c).forEach(function(k){if(c[k])o["c:"+k]="1"});
  var t=st.tahsilat||{};Object.keys(t).forEach(function(k){var v=t[k];if(v&&(v.amount||v.note||v.date))o["t:"+k]=JSON.stringify(v)});
  var r=st.rehber||{};Object.keys(r).forEach(function(k){o["r:"+k]=JSON.stringify(r[k])});
  (st.trash||[]).forEach(function(x){o["x:"+x.id]=JSON.stringify(x)});
  return o}
function unflat(o){var st={jobs:[],checks:{},tahsilat:{},rehber:{},trash:[]};
  Object.keys(o).forEach(function(k){var p=k.charAt(0),key=k.slice(2),v=o[k];
    if(p==="j")st.jobs.push(JSON.parse(v));else if(p==="c")st.checks[key]=true;
    else if(p==="t")st.tahsilat[key]=JSON.parse(v);else if(p==="r")st.rehber[key]=JSON.parse(v);
    else if(p==="x")st.trash.push(JSON.parse(v))});
  return st}

// Her kayıt değişikliğine zaman damgası bas, gönderilecekler listesine ekle
function stampChanges(){
  var f=flatOf(S),now=Date.now(),ch=false;
  if(!_snap)_snap=LS("z_snap")||{};
  Object.keys(f).forEach(function(k){if(_snap[k]!==f[k]){S.mt[k]=now;_out[k]=1;ch=true}});
  Object.keys(_snap).forEach(function(k){if(!(k in f)){S.mt[k]=now;_out[k]=1;ch=true}});
  _snap=f;LS("z_snap",f);LS("z_mt",S.mt);if(ch)saveOut();
  return ch}
function applyFlat(f,mt){
  var st=unflat(f);S.jobs=st.jobs;S.checks=st.checks;S.tahsilat=st.tahsilat;S.rehber=st.rehber;S.trash=st.trash;S.mt=mt;
  origSV();_snap=f;LS("z_snap",f);LS("z_mt",mt)}
// Dosyadan birleştirme (JSON yedek yüklerken)
function mergeStates(rem){
  var lf=flatOf(S),rf=flatOf(rem),lm=S.mt||{},rm=rem.mt||{},out={},mt={},keys={};
  [lf,rf,lm,rm].forEach(function(o){Object.keys(o).forEach(function(k){keys[k]=1})});
  Object.keys(keys).forEach(function(k){var lt=lm[k]||0,rt=rm[k]||0,useR;
    if(rt!==lt)useR=rt>lt;else useR=(k in rf)||!(k in lf);
    var src=useR?rf:lf,t=useR?rt:lt;if(k in src)out[k]=src[k];if(t)mt[k]=t});
  return{flat:out,mt:mt}}
// Buluttan gelen değişiklikleri uygula: her kayıtta en son değiştirilen kazanır
function applyRemote(ch){
  var keys=Object.keys(ch||{});if(!keys.length)return{};
  var f=flatOf(S),applied={},n=0;
  keys.forEach(function(k){var v=ch[k][0],t=ch[k][1];
    if(t>(S.mt[k]||0)){if(v===null)delete f[k];else f[k]=v;S.mt[k]=t;applied[k]=1;delete _out[k];n++}});
  if(n){applyFlat(f,S.mt);saveOut();uiRefresh()}
  return applied}
function isTyping(){var a=document.activeElement;return!!(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&a.id!=="searchInp"&&a.id!=="pinInp")}
function uiRefresh(){if(S.locked)return;if(isTyping())_sy.uiPending=true;else R()}

function pushOut(){
  var f=flatOf(S),all=Object.keys(_out),keys=all.slice(0,2500),ch={},sent={};
  keys.forEach(function(k){var t=S.mt[k]||1;ch[k]=[k in f?f[k]:null,t];sent[k]=t});
  return api("push",{since:LS("z_ver")||0,changes:ch,more:all.length>keys.length,device:deviceName()}).then(chk).then(function(r){
    keys.forEach(function(k){if((S.mt[k]||1)===sent[k])delete _out[k]});saveOut();
    applyRemote(r.changes);LS("z_ver",r.ver);
    if(Object.keys(_out).length)_sy.again=true})}

function syncNow(){
  if(!driveOn()){setBadge(ghActive()?"nokey":"ok");return}
  if(_sy.busy){_sy.again=true;return}
  _sy.busy=true;setBadge("busy");
  stampChanges();
  var p;
  if(LS("z_ver")===null){
    // Bu cihazın ilk bağlantısı: önce buluttakini al, sonra sadece bu cihazda olanları gönder
    var lf=flatOf(S),localT={};
    Object.keys(lf).forEach(function(k){localT[k]=S.mt[k]||1});
    Object.keys(S.mt).forEach(function(k){if(!(k in lf))localT[k]=S.mt[k]});
    p=api("pull",{since:0}).then(chk).then(function(r){
      var applied=applyRemote(r.changes);
      Object.keys(localT).forEach(function(k){if(!applied[k]){_out[k]=1;if(!S.mt[k])S.mt[k]=localT[k]}});
      LS("z_mt",S.mt);saveOut();LS("z_ver",r.ver);
      return Object.keys(_out).length?pushOut():null})
  }else if(Object.keys(_out).length){p=pushOut()}
  else{p=api("pull",{since:LS("z_ver")}).then(chk).then(function(r){applyRemote(r.changes);LS("z_ver",r.ver)})}
  p.then(function(){
    _sy.busy=false;_sy.err="";LS("z_lastSync",new Date().toISOString());setBadge("ok");
    if(_sy.again){_sy.again=false;setTimeout(syncNow,300)}
  }).catch(function(e){
    _sy.busy=false;_sy.again=false;
    if(e&&e.auth){_sy.err="Şifre buluttakiyle aynı değil";setBadge("auth")}
    else if(e&&e.locked){_sy.err="Çok fazla hatalı deneme — 1 saat bekleyin";setBadge("err")}
    else{_sy.err=(e&&e.msg)||"İnternet bağlantısı yok";setBadge(navigator.onLine?"err":"off")}
    uiRefreshIfAyar()})}
function uiRefreshIfAyar(){if(S.view==="ayar"&&!isTyping()&&!S.locked)R()}

function listSnaps(cb){api("backups").then(chk).then(function(r){cb(r.list||[])}).catch(function(){cb(null)})}
function restoreSnap(name){
  var gun=name.replace("yedek_","").replace(".json","");
  if(!confirm(gun+" tarihli yedek yüklenecek.\nMevcut veriler bu yedekle değiştirilecek ve diğer cihaza da aktarılacak.\n\nDevam?"))return;
  api("backup",{name:name}).then(chk).then(function(r){var d=r.data;
    S.jobs=d.jobs||[];S.checks=d.checks||{};S.tahsilat=d.tahsilat||{};S.rehber=d.rehber||{};S.trash=d.trash||[];
    SV();R();alert("Yedek yüklendi: "+S.jobs.length+" kayıt")}).catch(function(){alert("Yedek okunamadı")})}
function changeKey(pw){
  mkKey(pw).then(function(nk){
    if(!driveOn()){_key=nk;return}
    api("rekey",{newKey:nk}).then(chk).then(function(){_key=nk;alert("Şifre bu cihazda ve bulutta değişti.\nDiğer cihazda da yeni şifreyle giriş yapın.")})
      .catch(function(){alert("Şifre bu cihazda değişti ama buluta iletilemedi.\nİnternet bağlantısını kontrol edip tekrar deneyin.")})})}
function useCloudPw(pw){
  mkKey(pw).then(function(k){_key=k;localStorage.setItem("z_pw",pw);_sy.err="";syncNow();setTimeout(uiRefreshIfAyar,2500)})}

function paintBadge(el){
  if(!el)return;var dot=el.firstChild,txt=el.lastChild;if(!dot||!txt)return;
  var st=_sy.state,col,t,anim="none";
  if(st==="busy"){col="#f97316";t="Eşitleniyor…"}
  else if(st==="auth"){col="#ef4444";t="Şifre uyuşmuyor"}
  else if(st==="nokey"){col="#94a3b8";t="Şifreyle giriş gerekli"}
  else if(st==="err"){col="#ef4444";t="Hata — tekrar denenecek"}
  else if(st==="off"){col="#94a3b8";t=Object.keys(_out).length?"Çevrimdışı · bekliyor":"Çevrimdışı"}
  else{var ls=LS("z_lastSync");col="#22c55e";anim="pulse 2s infinite";t="Drive ✓ "+(ls?new Date(ls).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"}):"")}
  dot.style.background=col;dot.style.animation=anim;txt.textContent=t;txt.style.color=col}
function setBadge(st){_sy.state=st;paintBadge(document.getElementById("syncStatus"))}
function schedSync(){if(!driveOn())return;clearTimeout(_sy.timer);_sy.timer=setTimeout(syncNow,1200)}
function startGhSync(){
  if(_sy.poll)clearInterval(_sy.poll);
  if(!ghActive())return;
  syncNow();
  _sy.poll=setInterval(function(){if(!document.hidden&&!S.locked)syncNow()},15000)}
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!S.locked&&driveOn())syncNow()});
window.addEventListener("online",function(){if(!S.locked&&driveOn())syncNow()});
window.addEventListener("offline",function(){if(driveOn())setBadge("off")});
setInterval(function(){if(_sy.uiPending&&!isTyping()){_sy.uiPending=false;R()}},1500);

function origSV(){LS("z_jb",S.jobs);LS("z_ck",S.checks);LS("z_th",S.tahsilat);LS("z_tr",S.trash);LS("z_rh",S.rehber);LS("z_sync",new Date().toISOString())}
function smartMerge(d){
  if(d.mt){var bf=flatOf(S),m=mergeStates(d);applyFlat(m.flat,m.mt);Object.keys(m.mt).forEach(function(k){if(bf[k]!==m.flat[k])_out[k]=1});saveOut();schedSync();R();return"Birleştirildi: "+S.jobs.length+" kayıt"}
  if(!confirm("Bu dosyadaki "+(d.jobs||[]).length+" kayıt, mevcut "+S.jobs.length+" kaydın yerine yüklenecek.\nDevam?"))return"İptal edildi";
  S.jobs=d.jobs||[];S.checks=d.checks||{};S.tahsilat=d.tahsilat||{};S.rehber=d.rehber||{};S.trash=d.trash||[];
  SV();R();return"Yüklendi: "+S.jobs.length+" kayıt"}

var S={
  jobs:LS("z_jb")||SEED,checks:LS("z_ck")||{},tahsilat:LS("z_th")||{},trash:LS("z_tr")||[],rehber:LS("z_rh")||{},
  view:"is",search:"",openId:null,showAdd:false,showBk:false,locked:true,theme:"dark",
  selIv:null,rehEdit:null,confirmDel:null,mt:LS("z_mt")||{},showSnaps:false
};
if(new Date().getHours()>=7&&new Date().getHours()<19)S.theme="light";
fixAdaParsel();
_snap=LS("z_snap");if(!_snap){_snap=flatOf(S);LS("z_snap",_snap)}

function getCk(id,f){return!!S.checks[id+"_"+f]}
function getTh(id){return S.tahsilat[""+id]||{amount:0,date:"",note:""}}
function getBk(r){return r.tu-(getTh(r.id).amount||0)}
function gp(id){if(getCk(id,"teslim_ok"))return 6;var d=0;CK.forEach(function(c){if(getCk(id,c))d++});return d}
function pct(id){return getCk(id,"teslim_ok")?100:Math.round(gp(id)/6*100)}
function allJ(){return(S.jobs||SEED).slice().sort(function(a,b){return a.tr>b.tr?-1:a.tr<b.tr?1:b.id-a.id})}
function splitAP(v){var m=String(v||"").match(/^(\d+)\s*[\/\-]\s*(\d+)$/);return m?{ad:m[1],pr:m[2]}:null}
function actJ(){return allJ().filter(function(r){return r.ts!=="TESLİM"&&r.ts!=="İPTAL"})}
function fltJ(){
  var v=S.view,l=v==="is"?actJ():v==="eksik"?actJ().filter(function(r){return gp(r.id)<6}):allJ();
  if(S.search){var q=S.search.toLowerCase().trim(),dm=q.match(/^(\d+)\s*[-\/]\s*(\d+)$/);
    if(dm)l=l.filter(function(r){return r.ad&&r.ad.indexOf(dm[1])>=0&&r.pr&&r.pr.indexOf(dm[2])>=0});
    else l=l.filter(function(r){return(r.nm||"").toLowerCase().indexOf(q)>=0||(r.iv||"").toLowerCase().indexOf(q)>=0||(r.il||"").toLowerCase().indexOf(q)>=0||(r.mh||"").toLowerCase().indexOf(q)>=0||(r.ad||"").indexOf(q)>=0||(r.pr||"").indexOf(q)>=0})}
  return l}

function doRestore(){
  var input=document.createElement("input");input.type="file";input.accept=".xlsx,.xls,.json";
  input.onchange=function(e){var file=e.target.files[0];if(!file)return;
    var ext=file.name.split(".").pop().toLowerCase();
    var reader=new FileReader();
    if(ext==="json"){
      reader.onload=function(ev){
        try{var d=JSON.parse(ev.target.result);
          if(d.sync||d.version>=3){
            var msg=smartMerge(d);alert(msg)
          }else{
            var msg2=smartMerge(d);alert(msg2);
            
          }}
        catch(err){alert("JSON okunamadı")}};
      reader.readAsText(file);
    }else{
      loadXLSX(function(){
      reader.onload=function(ev){
        try{
          var wb=XLSX.read(ev.target.result,{type:"array",cellDates:true});
          var ws=wb.Sheets[wb.SheetNames[0]];
          var rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
          if(rows.length<2){alert("Veri bulunamadı");return}
          var h=rows[0];var ci={};
          for(var i=0;i<h.length;i++){
            var hv=String(h[i]||"").toUpperCase().trim();
            if(hv==="İŞVEREN"||hv==="ISVEREN")ci.iv=i;
            if(hv==="TARİH"||hv==="TARIH")ci.tr=i;
            if(hv==="İSİM"||hv==="ISIM"||hv==="MÜLKİYET"||hv==="MULKIYET")ci.nm=i;
            if(hv==="İLÇE"||hv==="ILCE")ci.il=i;
            if(hv==="MAHALLE")ci.mh=i;
            if(hv==="ADA")ci.ad=i;
            if(hv==="PARSEL")ci.pr=i;
            if(hv==="SONDAJ")ci.sondaj=i;
            if(hv==="LAB")ci.lab=i;
            if(hv.indexOf("AÇIKLAMA")>=0||hv.indexOf("ACIKLAMA")>=0)ci.note=i;
            if(hv==="TESLİM"||hv==="TESLIM")ci.teslim=i;
            if(hv==="TUTAR")ci.tu=i;
            if(hv==="TAHSİLAT"||hv==="TAHSILAT")ci.th=i;
            if(hv==="TARİH2"||hv==="TARIH2")ci.tr2=i;
          }
          var jobs=[],checks={},tahsilat={};
          for(var r=1;r<rows.length;r++){
            var row=rows[r];
            var tr=row[ci.tr!==undefined?ci.tr:1];
            if(!tr)continue;
            if(tr instanceof Date){var dd=tr;tr=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0")}
            else{tr=String(tr).split(" ")[0]}
            var rid=r-1;
            var clean=function(v){var s=String(v||"").trim();return s==="undefined"||s==="null"?"":s};
            var iv=clean(row[ci.iv!==undefined?ci.iv:0]);
            var nm=clean(row[ci.nm!==undefined?ci.nm:2]);
            var il=clean(row[ci.il!==undefined?ci.il:3]);
            var mh=clean(row[ci.mh!==undefined?ci.mh:4]);
            var ad=clean(row[ci.ad!==undefined?ci.ad:5]);
            var pr=clean(row[ci.pr!==undefined?ci.pr:6]);
            var spAP=splitAP(ad);if(spAP){ad=spAP.ad;if(!pr)pr=spAP.pr}
            var spAP2=splitAP(pr);if(spAP2){if(!ad)ad=spAP2.ad;pr=spAP2.pr}
            var sondaj=clean(row[ci.sondaj!==undefined?ci.sondaj:7]);
            var lab=clean(row[ci.lab!==undefined?ci.lab:8]);
            var note=clean(row[ci.note!==undefined?ci.note:9]);
            var teslim=clean(row[ci.teslim!==undefined?ci.teslim:10]);
            var tu=parseFloat(row[ci.tu!==undefined?ci.tu:11])||0;
            var thv=parseFloat(row[ci.th!==undefined?ci.th:12])||0;
            var tr2=ci.tr2!==undefined?clean(row[ci.tr2]):"";
            if(tr2 instanceof Date){var dd2=tr2;tr2=dd2.getFullYear()+"-"+String(dd2.getMonth()+1).padStart(2,"0")+"-"+String(dd2.getDate()).padStart(2,"0")}

            jobs.push({id:rid,iv:iv,tr:tr,nm:nm,il:il,mh:mh,ad:ad,pr:pr,tu:Math.round(tu),ts:teslim,sn:""});
            if(sondaj&&(sondaj.toUpperCase().indexOf("YAPILDI")>=0||sondaj.indexOf("202")>=0))checks[rid+"_sondaj"]=true;
            if(lab&&(lab.toUpperCase().indexOf("YAPILDI")>=0||lab.indexOf("202")>=0||lab==="X"))checks[rid+"_lab"]=true;
            if(teslim&&teslim.toUpperCase().indexOf("TESLİM")>=0)checks[rid+"_teslim_ok"]=true;
            if(thv>0)tahsilat[""+rid]={amount:Math.round(thv),date:tr2?String(tr2).split(" ")[0]:"",note:note};
          }
          S.jobs=jobs;S.checks=checks;S.tahsilat=tahsilat;
          SV();
          R();alert("Excel yüklendi: "+jobs.length+" kayıt");
        }catch(err){alert("Excel okunamadı: "+err.message)}};
      reader.readAsArrayBuffer(file);
      });
    }};input.click();
}

// === TKGM API ===
var TKGM_BASE="https://cbsapi.tkgm.gov.tr/megsiswebapi.v3.1/api";
var _tkgmIller=null;
var _tkgmCache={}; // parsel geometri cache {jobId: data}

function tkgmFetch(url,cb){
  fetch(url,{mode:"cors"}).then(function(r){return r.json()}).then(cb).catch(function(err){cb(null,err)})
}

function tkgmGetIller(cb){
  if(_tkgmIller)return cb(_tkgmIller);
  tkgmFetch("https://parselsorgu.tkgm.gov.tr/app/modules/administrativeQuery/data/ilListe.json",function(d){
    if(d){_tkgmIller=d;cb(d)}else cb(null)
  })
}

function tkgmAutoLoad(r){
  // Cache kontrolü
  if(_tkgmCache[r.id]){
    tkgmShowResult(r,_tkgmCache[r.id]);return
  }
  tkgmKML(r,function(ok){},true); // autoMode=true → sadece veri çek, indirme
}

function tkgmShowResult(r,data){
  var st=$("tkSt_"+r.id),dt=$("tkDt_"+r.id),kb=$("kml_"+r.id),rb=$("tkRe_"+r.id);
  if(!st)return;
  var props=data.properties||data;
  if(data.features&&data.features.length)props=data.features[0].properties||props;
  st.innerHTML="✅ Parsel bulundu!";st.style.color="#22c55e";st.style.background="#22c55e15";
  if(dt){
    var info="";
    if(props.alan)info+="<b>Alan:</b> "+props.alan+" m² &nbsp;";
    if(props.mevkii)info+="<b>Mevkii:</b> "+props.mevkii+" &nbsp;";
    if(props.nitelik)info+="<b>Nitelik:</b> "+props.nitelik+" &nbsp;";
    if(props.pafta)info+="<b>Pafta:</b> "+props.pafta+" &nbsp;";
    if(props.ilAdi)info+="<b>İl:</b> "+props.ilAdi+" &nbsp;";
    if(props.ilceAdi)info+="<b>İlçe:</b> "+props.ilceAdi+" &nbsp;";
    if(props.mahalleAdi)info+="<b>Mahalle:</b> "+props.mahalleAdi+" &nbsp;";
    if(!info)info="Parsel geometrisi mevcut — KML olarak indirebilirsiniz.";
    dt.innerHTML=info;dt.style.display="block";
  }
  if(kb)kb.style.display="inline-flex";
  if(rb)rb.style.display="inline-flex";
}

function tkgmShowError(r,msg){
  var st=$("tkSt_"+r.id),rb=$("tkRe_"+r.id);
  if(st){st.innerHTML="❌ "+msg;st.style.color="#ef4444";st.style.background="#ef444415"}
  if(rb)rb.style.display="inline-flex";

function tkgmKML(r,doneCb,autoMode){
  var ilce=(r.il||"").trim().toUpperCase();
  var mah=(r.mh||"").trim().toUpperCase();
  var ada=(r.ad||"").trim();
  var parsel=(r.pr||"").trim();
  if(!ilce||!mah||!ada||!parsel){
    if(!autoMode)alert("İLÇE, MAHALLE, ADA ve PARSEL bilgileri gerekli");
    tkgmShowError(r,"İLÇE, MAHALLE, ADA ve PARSEL bilgileri gerekli");doneCb(false);return}

  // İl listesini yükle, her ilde ilçeyi ara
  tkgmGetIller(function(iller){
    if(!iller||!iller.length){
      tkgmShowError(r,"TKGM bağlantısı kurulamadı — TKGM sitesinde manuel arama yapın");
      if(!autoMode){window.open("https://parselsorgu.tkgm.gov.tr/","_blank")}
      doneCb(false);return
    }

    // Tüm illerde ilçe ara (paralel)
    var found=false;var checked=0;var total=iller.length;

    function tryIl(ilObj){
      var ilId=ilObj.id||ilObj.ilId||ilObj.ID;
      if(!ilId){checked++;if(checked>=total&&!found){noResult()};return}
      tkgmFetch(TKGM_BASE+"/idariYapi/ilceListe/"+ilId,function(ilceler){
        if(found)return;checked++;
        if(ilceler&&ilceler.length){
          var match=ilceler.find(function(ic){return(ic.ad||ic.adi||ic.name||"").toUpperCase().indexOf(ilce)>=0||(ic.text||"").toUpperCase().indexOf(ilce)>=0});
          if(match){
            found=true;
            var ilceId=match.id||match.ilceId||match.ID;
            tkgmFindMahalle(ilceId,mah,ada,parsel,doneCb,r,autoMode);
          }
        }
        if(checked>=total&&!found)noResult();
      })
    }

    function noResult(){
      tkgmShowError(r,"İlçe bulunamadı: "+ilce);
      if(!autoMode){alert("İlçe bulunamadı: "+ilce);window.open("https://parselsorgu.tkgm.gov.tr/","_blank")}
      doneCb(false);
    }

    // İlk 10 ili dene (performans), sonra kalanları
    var batch=Math.min(5,total);
    for(var i=0;i<batch;i++)tryIl(iller[i]);
    // Kalan illeri 500ms aralıklarla dene
    var idx=batch;
    var intv=setInterval(function(){
      if(found||idx>=total){clearInterval(intv);return}
      var end=Math.min(idx+5,total);
      for(var j=idx;j<end;j++)tryIl(iller[j]);
      idx=end;
    },300);
  });
}

function tkgmFindMahalle(ilceId,mah,ada,parsel,doneCb,r,autoMode){
  tkgmFetch(TKGM_BASE+"/idariYapi/mahalleListe/"+ilceId,function(mahalleler){
    if(!mahalleler||!mahalleler.length){tkgmShowError(r,"Mahalle listesi alınamadı");doneCb(false);return}
    var match=mahalleler.find(function(m){return(m.ad||m.adi||m.name||m.text||"").toUpperCase().indexOf(mah)>=0});
    if(!match){tkgmShowError(r,"Mahalle bulunamadı: "+mah);doneCb(false);return}
    var mahId=match.id||match.mahalleId||match.ID;
    tkgmGetParsel(mahId,ada,parsel,doneCb,r,autoMode);
  });
}

function tkgmGetParsel(mahId,ada,parsel,doneCb,r,autoMode){
  tkgmFetch(TKGM_BASE+"/parsel/"+mahId+"/"+ada+"/"+parsel,function(d){
    if(!d||(!d.geometry&&!d.properties&&!d.features)){
      tkgmFetch(TKGM_BASE+"/parsel?mahalleId="+mahId+"&ada="+ada+"&parsel="+parsel,function(d2){
        if(!d2){tkgmShowError(r,"Parsel bulunamadı: Ada "+ada+" / Parsel "+parsel);doneCb(false);return}
        _tkgmCache[r.id]=d2;
        if(autoMode){tkgmShowResult(r,d2);doneCb(true)}else{generateKML(d2,ada,parsel,doneCb)}
      });return
    }
    _tkgmCache[r.id]=d;
    if(autoMode){tkgmShowResult(r,d);doneCb(true)}else{generateKML(d,ada,parsel,doneCb)}
  });
}

function generateKML(data,ada,parsel,doneCb){
  var coords="";var props=data.properties||data;
  // GeoJSON geometrisi
  var geom=data.geometry||null;
  if(data.features&&data.features.length)geom=data.features[0].geometry;
  if(!geom){
    // Koordinat dizisi olarak dene
    if(data.coordinates||data.koordinatlar){
      var c=data.coordinates||data.koordinatlar;
      coords=formatCoords(c);
    }else{
      alert("Parsel geometrisi bulunamadı.\nTKGM sitesinde manuel arama yapın.");
      doneCb(false);return
    }
  }else{
    coords=formatCoords(geom.coordinates);
  }

  var kml='<?xml version="1.0" encoding="UTF-8"?>\n'
    +'<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document>\n'
    +'<name>Ada '+ada+' Parsel '+parsel+'</name>\n'
    +'<Style id="parsel"><LineStyle><color>ff0000ff</color><width>3</width></LineStyle><PolyStyle><color>400000ff</color></PolyStyle></Style>\n'
    +'<Placemark>\n<name>Ada: '+ada+' / Parsel: '+parsel+'</name>\n'
    +'<description>'+(props.alan?'Alan: '+props.alan+' m²\n':'')+(props.mevkii?'Mevkii: '+props.mevkii+'\n':'')+(props.nitelik?'Nitelik: '+props.nitelik:'')+'</description>\n'
    +'<styleUrl>#parsel</styleUrl>\n'
    +'<Polygon><outerBoundaryIs><LinearRing><coordinates>\n'
    +coords
    +'\n</coordinates></LinearRing></outerBoundaryIs></Polygon>\n'
    +'</Placemark>\n</Document>\n</kml>';

  var blob=new Blob([kml],{type:"application/vnd.google-earth.kml+xml"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="parsel_"+ada+"_"+parsel+".kml";a.click();
  doneCb(true);
}

function formatCoords(c){
  if(!c)return"";
  // Tek koordinat [lng,lat] veya [lng,lat,alt]
  if(typeof c[0]==="number")return c[0]+","+c[1]+","+(c[2]||0);
  // Dizi dizisi — polygon ring veya multi
  if(Array.isArray(c[0])){
    if(typeof c[0][0]==="number"){
      // [[lng,lat],[lng,lat],...]
      return c.map(function(p){return p[0]+","+p[1]+","+(p[2]||0)}).join("\n");
    }
    // [[[lng,lat],...]] — polygon with rings
    return formatCoords(c[0]);
  }
  return"";
}
